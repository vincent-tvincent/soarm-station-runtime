<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SOARM Workstation</title>
<style>:root{color-scheme:dark;font:15px system-ui;background:#11181d;color:#e9f1ed}body{max-width:1400px;margin:32px auto;padding:0 24px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:25px;letter-spacing:-.5px}.muted{color:#93a7ab}button,input,select{font:inherit;border:1px solid #405255;border-radius:6px;background:#223236;color:inherit;padding:9px 13px}button{cursor:pointer}button:hover{background:#38514b}.hold{background:#8b3e32}section{background:#1a262c;border:1px solid #2e4147;border-radius:10px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}img{width:100%;border-radius:6px}pre{white-space:pre-wrap;font-size:12px}.metric{font:28px ui-monospace}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:7px;border-bottom:1px solid #314046}.pill{color:#77d2a3}canvas{width:100%;height:180px}label{display:block;margin:8px 0}input[type=range]{width:60%}.alert{color:#ffc38e}#login{display:flex;gap:8px}</style>
<header><div><h1>SOARM <span class="muted">/ workstation</span></h1><div id="device" class="muted">Robot state · cameras · durable history</div></div><span id="connection">Disconnected</span></header>
<section id="login"><input id="token" type="password" placeholder="Operator token" autocomplete="off"><button id="connect">Connect</button></section>
<section><div class="grid"><div><span class="muted">Locally committed</span><div id="local" class="metric">—</div></div><div><span class="muted">Remotely committed</span><div id="remote" class="metric">—</div></div><div><span class="muted">Queued for upload</span><div id="queued" class="metric">—</div></div></div><p id="uploadError" class="alert"></p></section>
<div id="arms" class="grid"></div><div id="cameras" class="grid"></div>
<section><h2>Measured history</h2><select id="historyArm"></select><button id="loadHistory">Refresh</button><canvas id="chart" width="1100" height="220"></canvas><div class="muted">Measured joint positions in radians · invalid samples remain gaps</div></section>
<section><h2>Incidents and decisions</h2><pre id="events">No incidents received</pre></section>
<script>
let token='',state={},built=false,control=null,grant=null,seq=0,armControl='',target={},gripper=50,principal='browser-'+crypto.randomUUID(),timer=null;
const $=x=>document.getElementById(x);const headers=()=>({'Authorization':'Bearer '+token,'Content-Type':'application/json'});
async function api(path,body){const r=await fetch(path,{headers:headers(),method:body?'POST':'GET',body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error(await r.text());return r.json()}
$('connect').onclick=async()=>{token=$('token').value;try{state=await api('/api/status');$('login').style.display='none';setInterval(refresh,100);setInterval(images,150);refresh()}catch(e){alert(e.message)}};
async function refresh(){try{state=await api('/api/status');$('connection').textContent='Connected';$('device').textContent=state.device_id;for(const [k,v]of Object.entries({local:'local_committed',remote:'remote_committed',queued:'queued'}))$(k).textContent=state.upload[v]??'—';$('uploadError').textContent=state.upload.error||'';
if(!built&&Object.keys(state.arms).length){for(const n of Object.keys(state.arms)){const s=document.createElement('section');s.innerHTML=`<h2>${n}</h2><div id="status-${n}"></div><table id="joints-${n}"></table><p><button onclick="enable('${n}')">Enable control</button> <button class="hold" onclick="hold('${n}')">Hold</button></p><button onclick="manual('${n}')">Start manual stream</button><div id="sliders-${n}"></div>`;$('arms').append(s);$('historyArm').add(new Option(n,n))}for(const n of state.cameras){const s=document.createElement('section');s.innerHTML=`<h3>${n}</h3><img id="image-${n}" alt="${n} camera">`;$('cameras').append(s)}built=true}
for(const[n,s]of Object.entries(state.arms)){$('status-'+n).textContent=`${s.phase} · permission ${s.permission?'enabled':'disabled'} · torque ${s.measured_torque} · age ${s.feedback_age_ms} ms · ${s.measured_hz.toFixed(1)} Hz ${s.fault||''}`;const j=state.joints[n];if(j)$('joints-'+n).innerHTML=j.name.map((name,i)=>`<tr><td>${name.split('/').pop()}</td><td>${(j.position[i]*180/Math.PI).toFixed(1)}°</td></tr>`).join('')}
$('events').textContent=JSON.stringify([...state.events,...state.decisions].slice(-15),null,2)||'No incidents';}catch(e){$('connection').textContent='Connection unavailable'}}
async function images(){for(const n of state.cameras||[]){const r=await fetch('/api/cameras/'+n+'.jpg',{headers:headers()});if(r.ok){const el=$('image-'+n);if(el){const old=el.src;el.src=URL.createObjectURL(await r.blob());if(old.startsWith('blob:'))URL.revokeObjectURL(old)}}}}
async function enable(n){const s=state.arms[n];alert(JSON.stringify(await api('/api/permission',{arm_id:n,controller_session:s.controller_session,operator_session_id:principal,enable:true})))}
async function hold(n){if(control)control.close();clearInterval(timer);await api('/api/hold',{arm_id:n})}
async function manual(n){if(control)control.close();clearInterval(timer);const j=state.joints[n];target=Object.fromEntries(j.name.map((x,i)=>[x.split('/').pop(),j.position[i]]));gripper=state.arms[n].gripper_percent;armControl=n;grant=null;seq=0;const box=$('sliders-'+n);box.innerHTML='';for(const[k,v]of Object.entries(target)){const l=document.createElement('label');l.textContent=k+' ';const input=document.createElement('input');input.type='range';input.min='-3.14';input.max='3.14';input.step='.005';input.value=v;input.oninput=()=>target[k]=+input.value;l.append(input);box.append(l)}
// The token is sent in the authenticated WebSocket handshake, never in a URL.
control=new WebSocket(location.origin.replace('https','wss')+'/ws/control',['soarm',token]);control.onopen=()=>control.send(JSON.stringify({arm_id:n,runtime_boot_id:state.arms[n].runtime_boot_id,controller_session:state.arms[n].controller_session,operator_session_id:principal,operation_type:'DIRECT',mode:'STREAM',duration_s:120}));control.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='grant')grant=d.grant;if(d.type==='error')alert(d.reason)};
timer=setInterval(()=>{if(!grant||!control||control.readyState!==1)return;control.send(JSON.stringify({...grant,arm_id:n,frame_kind:'COMMAND',sequence:++seq,input_id:crypto.randomUUID(),body:{positions:{...target},gripper,gripper_unit:'percent'}}))},10)}
$('loadHistory').onclick=async()=>{const data=await api('/api/history?arm='+$('historyArm').value+'&limit=500');const c=$('chart'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const rows=data.records;if(!rows.length)return;const colors=['#77d2a3','#efb873','#79b9ed','#ca9cdb','#ec8c90'];for(let j=0;j<5;j++){ctx.strokeStyle=colors[j];ctx.beginPath();let pen=false;rows.forEach((r,i)=>{const q=r.sample.measured_joints.position[j];if(!r.sample.valid||q===undefined){pen=false;return}const x=i/(rows.length-1||1)*c.width,y=c.height/2-q*30;if(pen)ctx.lineTo(x,y);else ctx.moveTo(x,y);pen=true});ctx.stroke()}};
</script></html>
